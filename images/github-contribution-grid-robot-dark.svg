<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 192" width="880" height="192" xmlns="http://www.w3.org/2000/svg">
  <desc>Humanoid robot walking on a contribution-style grid (dark mode)</desc>

  <defs>
    <!-- Dark grid pattern (like GitHub dark contributions) -->
    <pattern id="gridDark" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="14" height="14" rx="2" ry="2" fill="#161b22" stroke="#0d1117" stroke-width="1"/>
    </pattern>

    <!-- Robot colors -->
    <linearGradient id="robotBodyDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="robotAccentDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <style>
      .grid-bg {
        fill: url(#gridDark);
      }

      .robot {
        transform-origin: 0 0;
        animation: walk 14s linear infinite;
      }

      @keyframes walk {
        0%, 4%   { transform: translate(16px, 16px); }
        16%      { transform: translate(240px, 16px); }
        20%      { transform: translate(240px, 64px); }
        36%      { transform: translate(544px, 64px); }
        40%      { transform: translate(544px, 112px); }
        60%      { transform: translate(832px, 112px); }
        70%      { transform: translate(832px, 32px); }
        84%      { transform: translate(128px, 32px); }
        94%      { transform: translate(128px, 16px); }
        100%     { transform: translate(16px, 16px); }
      }

      .robot-head {
        animation: headBob 1s ease-in-out infinite alternate;
        transform-origin: 50% 100%;
      }

      @keyframes headBob {
        from { transform: translateY(0px); }
        to   { transform: translateY(-1.5px); }
      }

      .robot-led {
        animation: ledBlink 1.6s ease-in-out infinite;
      }

      @keyframes ledBlink {
        0%, 20%   { opacity: 0.15; }
        25%, 40%  { opacity: 1; }
        45%, 100% { opacity: 0.15; }
      }
    </style>
  </defs>

  <!-- Background grid -->
  <rect class="grid-bg" x="0" y="0" width="880" height="160"/>

  <!-- Humanoid robot -->
  <g class="robot">
    <!-- Shadow -->
    <ellipse cx="24" cy="44" rx="14" ry="4" fill="#000000" opacity="0.35"/>

    <!-- Legs -->
    <g>
      <rect x="18" y="24" width="4" height="14" rx="2" fill="#4b5563"/>
      <rect x="26" y="24" width="4" height="14" rx="2" fill="#4b5563"/>

      <!-- Feet -->
      <rect x="16" y="37" width="8" height="3" rx="1.5" fill="#1f2937"/>
      <rect x="24" y="37" width="8" height="3" rx="1.5" fill="#1f2937"/>
    </g>

    <!-- Torso -->
    <rect x="14" y="12" width="20" height="14" rx="4" fill="url(#robotBodyDark)"/>

    <!-- Torso panel -->
    <rect x="17" y="15" width="14" height="8" rx="2" fill="#020617" stroke="#6b7280" stroke-width="0.8"/>

    <!-- LEDs -->
    <circle class="robot-led" cx="20" cy="19" r="1.2" fill="#22c55e"/>
    <circle class="robot-led" cx="24" cy="19" r="1.2" fill="#facc15"/>
    <circle class="robot-led" cx="28" cy="19" r="1.2" fill="#f97316"/>

    <!-- Arms -->
    <g>
      <!-- Left arm -->
      <rect x="10" y="14" width="4" height="10" rx="2" fill="#9ca3af"/>
      <circle cx="12" cy="24" r="2.2" fill="#9ca3af"/>

      <!-- Right arm -->
      <rect x="34" y="14" width="4" height="10" rx="2" fill="#9ca3af"/>
      <circle cx="36" cy="24" r="2.2" fill="#9ca3af"/>
    </g>

    <!-- Neck -->
    <rect x="19" y="8" width="10" height="3" rx="1.5" fill="#6b7280"/>

    <!-- Head -->
    <g class="robot-head">
      <rect x="16" y="0" width="16" height="10" rx="3" fill="#111827" stroke="#6b7280" stroke-width="0.8"/>

      <!-- Eyes -->
      <circle cx="21" cy="5" r="1.5" fill="#0f172a"/>
      <circle cx="27" cy="5" r="1.5" fill="#0f172a"/>

      <!-- Eye glow -->
      <circle cx="21" cy="5" r="0.7" fill="#38bdf8" opacity="0.95"/>
      <circle cx="27" cy="5" r="0.7" fill="#38bdf8" opacity="0.95"/>

      <!-- Antenna -->
      <line x1="24" y1="-2" x2="24" y2="0" stroke="#6b7280" stroke-width="1"/>
      <circle cx="24" cy="-3.5" r="1.3" fill="url(#robotAccentDark)"/>
    </g>
  </g>
</svg>
