<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="260" viewBox="0 0 400 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="armGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="jointGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <radialGradient id="appleGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="40%" stop-color="#f97373"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="400" height="260" rx="24" fill="url(#bgGrad)"/>

  <!-- Table -->
  <rect x="40" y="190" width="320" height="14" rx="7" fill="#020617"/>
  <rect x="40" y="196" width="320" height="4" fill="#020617" opacity="0.6"/>

  <!-- Robot base -->
  <g transform="translate(90,190)">
    <rect x="-26" y="-18" width="52" height="36" rx="10" fill="#020617"/>
    <rect x="-20" y="-12" width="40" height="24" rx="8" fill="#0f172a"/>
    <circle cx="0" cy="-8" r="10" fill="url(#jointGrad)"/>
  </g>

  <!-- Apple (on table, then lifted) -->
  <g id="apple" transform="translate(250,176)">
    <circle cx="0" cy="0" r="14" fill="url(#appleGrad)"/>
    <path d="M-2 -15 C -2 -20 4 -22 7 -18"
          fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-2" cy="-15" r="2" fill="#15803d"/>

    <!-- Apple lift animation -->
    <animateTransform attributeName="transform"
                      type="translate"
                      dur="4s"
                      repeatCount="indefinite"
                      values="250,176; 250,176; 250,120; 250,120; 250,176"
                      keyTimes="0;0.3;0.5;0.8;1"/>
  </g>

  <!-- Robot arm, anchored at base joint (90,190) -->
  <g id="arm-root" transform="translate(90,190)">

    <!-- Shoulder joint -->
    <circle cx="0" cy="0" r="10" fill="url(#jointGrad)"/>

    <!-- Upper arm (rotates at shoulder) -->
    <g id="upper-arm">
      <rect x="-7" y="-80" width="14" height="80" rx="7" fill="url(#armGrad)"/>
      <rect x="-4" y="-76" width="8" height="72" rx="4" fill="#e5f3ff" opacity="0.18"/>

      <!-- Elbow joint -->
      <g id="elbow" transform="translate(0,-80)">
        <circle cx="0" cy="0" r="8" fill="url(#jointGrad)"/>

        <!-- Forearm (rotates at elbow) -->
        <g id="forearm">
          <rect x="-6" y="-70" width="12" height="70" rx="6" fill="url(#armGrad)"/>
          <rect x="-3" y="-66" width="6" height="62" rx="3" fill="#e5f3ff" opacity="0.22"/>

          <!-- Wrist -->
          <g id="wrist" transform="translate(0,-70)">
            <circle cx="0" cy="0" r="7" fill="url(#jointGrad)"/>

            <!-- Gripper -->
            <g id="gripper" transform="translate(0,-18)">
              <!-- Palm -->
              <rect x="-10" y="-4" width="20" height="8" rx="4" fill="#020617"/>

              <!-- Left finger -->
              <rect id="finger-left" x="-16" y="-16" width="5" height="22" rx="3" fill="#e5e7eb">
                <animate attributeName="x"
                         dur="4s"
                         repeatCount="indefinite"
                         values="-16;-16;-9;-9;-16"
                         keyTimes="0;0.25;0.35;0.6;1"/>
              </rect>

              <!-- Right finger -->
              <rect id="finger-right" x="11" y="-16" width="5" height="22" rx="3" fill="#e5e7eb">
                <animate attributeName="x"
                         dur="4s"
                         repeatCount="indefinite"
                         values="11;11;4;4;11"
                         keyTimes="0;0.25;0.35;0.6;1"/>
              </rect>
            </g>
          </g>
        </g>

        <!-- Forearm rotation (reaching for apple and lifting) -->
        <animateTransform attributeName="transform"
                          type="rotate"
                          dur="4s"
                          repeatCount="indefinite"
                          values="15; 35; 45; 15"
                          keyTimes="0;0.25;0.6;1"/>
      </g>
    </g>

    <!-- Upper arm rotation -->
    <animateTransform attributeName="transform"
                      type="rotate"
                      dur="4s"
                      repeatCount="indefinite"
                      values="0; -18; -26; 0"
                      keyTimes="0;0.25;0.6;1"/>
  </g>

  <!-- Shadow under apple -->
  <ellipse cx="250" cy="186" rx="18" ry="4" fill="#020617" opacity="0.7">
    <animate attributeName="opacity"
             dur="4s"
             repeatCount="indefinite"
             values="0.7;0.7;0.25;0.25;0.7"
             keyTimes="0;0.3;0.5;0.8;1"/>
    <animate attributeName="rx"
             dur="4s"
             repeatCount="indefinite"
             values="18;18;10;10;18"
             keyTimes="0;0.3;0.5;0.8;1"/>
  </ellipse>

</svg>
